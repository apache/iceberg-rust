name: Public API

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # cargo-public-api has no prebuilt binaries and takes about 5 minutes to build,
      # so cache it on its own instead of relying on the much larger Rust cache above,
      # which is often evicted. The key uses the Makefile, which pins the version.
      - name: Cache cargo-public-api
        id: cache-public-api
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: Install cargo-public-api
        if: steps.cache-public-api.outputs.cache-hit != 'true'
        run: make install-cargo-public-api

      - name: Check public API
        # A binary restored from the cache lacks cargo's install records, so the Makefile's
        # install prerequisite would rebuild it. `-o` tells make to skip that target.
        run: make -o install-cargo-public-api check-public-api
