name: Bindings Python CI

on:
  push:
    branches:
      - main
    paths:
      - '**'                                       # Include all files and directories in the repository by default.
      - '!.github/ISSUE_TEMPLATE/**'               # Exclude files and directories that don't impact tests or code like templates, metadata, and documentation.
      - '!website/**'
      - '!.asf.yml'
      - '!.gitattributes'
      - '!.gitignore'
      - '!CONTRIBUTING.md'
      - '!CHANGELOG.md'
      - '!LICENSE'
      - '!NOTICE'
      - '!README.md'
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-python:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.3"
          enable-cache: true
      - name: Install tools
        run: |
          uv tool install ruff@0.15.22
      - name: Check format
        working-directory: "bindings/python"
        run: |
          uvx ruff format . --diff
      - name: Check style
        working-directory: "bindings/python"
        run: |
          uvx ruff check .

  wheel-license-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Install cargo-about
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          # Keep the version in sync with EXPECTED_CARGO_ABOUT_VERSION in
          # dev/release/licenses.py.
          tool: cargo-about@0.8.4
      - name: Generate per-wheel LICENSE, NOTICE and THIRD-PARTY-LICENSES
        shell: bash
        run: python3 ./dev/release/licenses.py wheel generate bindings/python
      # License files for all wheels are uploaded as a single artifact, specific per-wheel files taken later.
      - name: Upload generated license files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-license-files
          path: bindings/python/licenses
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.os }}
    needs: [wheel-license-files]
    strategy:
      max-parallel: 15
      matrix:
        include:
          - os: macos-latest
            # Uses runner's target rather than a cross-architect target as in release workflows.
            # No point building x86 wheel if we do not test it.
            maturin_target: aarch64-apple-darwin
          - os: windows-latest
            maturin_target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            maturin_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      # Linux maturin builds may run inside manylinux Docker, so host Rust caches only help Windows/macOS.
      - name: Setup Rust toolchain
        if: runner.os != 'Linux'
        uses: $/.github/actions/setup-builder
      - name: Cache Rust artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bindings-python
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Download generated license files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-license-files
          path: bindings/python/licenses
      # Must run before maturin, maturin will bundle these in to the wheels.
      - name: Stage license files for wheel
        shell: bash
        run: |
          python3 ./dev/release/licenses.py wheel stage bindings/python \
            --maturin-target "${{ matrix.maturin_target }}"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.maturin_target }}
          working-directory: "bindings/python"
          command: build
          args: --out dist -i python3.12 # Explicitly set interpreter; manylinux containers have multiple Pythons and maturin may pick an older one
      # Additional verifications - missing files aren't flagged by Maturin.
      - name: Verify wheel bundles third-party licenses
        shell: bash
        run: |
          python3 ./dev/release/licenses.py wheel verify bindings/python/dist \
            --maturin-target "${{ matrix.maturin_target }}"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.3"
          enable-cache: true
      - name: Sync dependencies
        working-directory: "bindings/python"
        shell: bash
        run: |
          uv sync --group dev --no-install-project
      - name: Install built wheel
        working-directory: "bindings/python"
        shell: bash
        # --no-index keeps resolution inside dist/: --find-links alone only adds a
        # source, so a newer PyPI release would win and be tested instead.
        run: |
          uv pip install --no-build --reinstall --no-index --find-links dist/ pyiceberg-core
      - name: Run tests
        working-directory: "bindings/python"
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          make test

  bindings-python-ci-required:
    if: ${{ always() }}
    needs: [check-python, test]
    runs-on: ubuntu-slim
    steps:
      - name: Verify Bindings Python CI jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            test "$result" = "success"
          done
