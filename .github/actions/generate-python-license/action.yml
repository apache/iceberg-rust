name: Generate wheel third-party licenses
description: 'Regenerates bindings/python/LICENSE with the root LICENSE plus the licenses of the Rust dependencies bundled in the wheels. The sdist keeps the root LICENSE.'
runs:
  using: "composite"
  steps:
    - name: Install cargo-about
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: cargo-about@0.9.2

    - name: Generate LICENSE
      shell: bash
      working-directory: bindings/python
      run: |
        cargo about generate -c about.toml --locked --fail --manifest-path Cargo.toml about.hbs > cargo-about-output.txt
        # LICENSE is a symlink to the root file, remove it so the redirect doesn't write through.
        rm LICENSE
        cat ../../LICENSE cargo-about-output.txt > LICENSE
