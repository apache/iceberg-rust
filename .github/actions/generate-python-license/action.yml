name: Generate wheel third-party licenses
description: 'Regenerates bindings/python/LICENSE and NOTICE with the root files plus the licenses and notices of the Rust dependencies bundled in the wheels. The sdist keeps the root files.'
runs:
  using: "composite"
  steps:
    - name: Install cargo-about
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: cargo-about@0.9.2

    - name: Generate LICENSE and NOTICE
      shell: bash
      working-directory: bindings/python
      run: |
        cargo about generate -c about.toml --locked --fail --manifest-path Cargo.toml about.hbs > cargo-about-output.txt
        # cargo-about exits 0 and leaves the template placeholders when it can't match a license file.
        if grep -nE '<year>|<owner>|<copyright holders>' cargo-about-output.txt; then
          echo "::error::cargo-about left placeholder text in the generated licenses"
          exit 1
        fi
        # Both are symlinks to the root files, remove them so the redirects don't write through.
        rm LICENSE NOTICE
        cat ../../LICENSE cargo-about-output.txt third-party-licenses.txt > LICENSE
        { cat ../../NOTICE; echo; cat third-party-notices.txt; } > NOTICE
