# Configuration for `cargo about`, which lists the license texts of the Rust
# dependencies compiled into pyiceberg-core.
#
# Keep `accepted` in line with deny.toml. Order is preference when a crate offers
# a choice, so add new licenses at the end.
#
# Accepted licenses must be ASF Category A or B:
# https://www.apache.org/legal/resolved.html
accepted = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  # Not on that page; Category A per
  # https://issues.apache.org/jira/browse/LEGAL-660
  "Unicode-3.0",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The wheel targets in release_python.yml and release_python_nightly.yml. Keep in sync.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "armv7-unknown-linux-gnueabihf",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

# The published crate omits its LICENSE, so cargo-about fetches it from the
# upstream repository.
[alloc-stdlib.clarify]
license = "BSD-3-Clause"
[[alloc-stdlib.clarify.git]]
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"
path = "LICENSE"

# libm's license is in LICENSE.txt, which cargo-about doesn't match by name.
[libm.clarify]
license = "MIT"
[[libm.clarify.files]]
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"
path = "LICENSE.txt"
