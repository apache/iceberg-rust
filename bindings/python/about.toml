# Configuration for `cargo about`, which lists the license texts of the Rust
# dependencies compiled into pyiceberg-core.
#
# Keep `accepted` in line with deny.toml. Order is preference when a crate offers
# a choice, so add new licenses at the end.
#
# Accepted licenses must be ASF Category A or B:
# https://www.apache.org/legal/resolved.html
accepted = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  # Not on that page; Category A per
  # https://issues.apache.org/jira/browse/LEGAL-660
  "Unicode-3.0",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The wheel targets in release_python.yml and release_python_nightly.yml. Keep in sync.
# 0.11.x branch builds no windows-arm wheel, so aarch64-pc-windows-msvc is absent.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "armv7-unknown-linux-gnueabihf",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

# The published crate omits its LICENSE, so cargo-about fetches it from the
# upstream repository.
[alloc-stdlib.clarify]
license = "BSD-3-Clause"
[[alloc-stdlib.clarify.git]]
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"
path = "LICENSE"

# libm's license is in LICENSE.txt, which cargo-about doesn't match by name.
[libm.clarify]
license = "MIT"
[[libm.clarify.files]]
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"
path = "LICENSE.txt"

# zstd-sys vendors zstd's C code (BSD-3-Clause, Meta) next to the Rust
# bindings (BSD-3-Clause, Facebook); neither is in its Cargo.toml license.
[zstd-sys.clarify]
license = "MIT AND BSD-3-Clause"
[[zstd-sys.clarify.files]]
checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8"
license = "MIT"
path = "LICENSE.Mit"
[[zstd-sys.clarify.files]]
checksum = "48341f685c87304089aa099b23c386f8bacc519ef555aa7a13e239908907b3fd"
license = "BSD-3-Clause"
path = "LICENSE.BSD-3-Clause"
[[zstd-sys.clarify.files]]
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"
license = "BSD-3-Clause"
path = "zstd/LICENSE"

# aws-lc-sys ships under a series of licenses. However, the licenses are included as one file.
# For simplicity, we just point each license at the same file at the cost of duplicating the license text.
[aws-lc-sys.clarify]
license = "Apache-2.0 AND ISC AND MIT AND BSD-3-Clause"
[[aws-lc-sys.clarify.files]]
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"
path = "LICENSE"

# For individual crate acceptions, refer to deny.toml.

[colored]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]
