# brotli-decompressor clarification is a hard one.
# The declared license is inaccurate, as the crate src includes both MIT and BSD-3-Clause licensed code
# so it is BOTH licenses, not either as originally declared.
# However, the source does not include the original MIT license so we cannot write a clarify rule.
# To work around this, this clarify statement removes the MIT clause which is later restored
# by dev/release/licenses.py.
#
# Note, there's a PR open to address this issue here:
# https://github.com/dropbox/rust-brotli-decompressor/pull/32
[brotli-decompressor.clarify]
license = "BSD-3-Clause"

[[brotli-decompressor.clarify.files]]
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"
path = "LICENSE"

# libm packages its license as LICENSE.txt, which cargo-about does not match by name.
# The file is upstream's own combined text and is what should be reproduced.
[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"
path = "LICENSE.txt"

# The published crate omits the file entirely, so there is nothing on disk to point `files` at.
# `git` retrieves it from the source repository at the commit the crate was published from.
[alloc-stdlib.clarify]
license = "BSD-3-Clause"

[[alloc-stdlib.clarify.git]]
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"
path = "LICENSE"

