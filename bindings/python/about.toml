# Configuration for `cargo about`, which lists the license texts of the Rust
# dependencies compiled into pyiceberg-core.
#
# Keep `accepted` in line with deny.toml. Order is preference when a crate offers
# a choice, so add new licenses at the end.
#
# Accepted licenses must be ASF Category A or B:
# https://www.apache.org/legal/resolved.html
accepted = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  # Not on that page; Category A per
  # https://issues.apache.org/jira/browse/LEGAL-660
  "Unicode-3.0",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# zstd-sys vendors zstd's C code (BSD-3-Clause, Meta) next to the Rust
# bindings (BSD-3-Clause, Facebook); neither is in its Cargo.toml license.
[zstd-sys.clarify]
license = "MIT AND BSD-3-Clause"
[[zstd-sys.clarify.files]]
checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8"
license = "MIT"
path = "LICENSE.Mit"
[[zstd-sys.clarify.files]]
checksum = "48341f685c87304089aa099b23c386f8bacc519ef555aa7a13e239908907b3fd"
license = "BSD-3-Clause"
path = "LICENSE.BSD-3-Clause"
[[zstd-sys.clarify.files]]
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"
license = "BSD-3-Clause"
path = "zstd/LICENSE"
