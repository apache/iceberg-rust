# cargo-about configuration for THIRD-PARTY-LICENSES, the license-text bundle
# shipped inside the pyiceberg-core wheels. Regenerate with
# `dev/release/licenses.py wheel generate bindings/python`.

# Dev-dependencies never reach the wheel. Build-dependencies can contribute
# generated code to the final binary, so they are deliberately not ignored.
ignore-build-dependencies = false
ignore-dev-dependencies = true

# ORDER IS SIGNIFICANT. Do not sort this list.
#
# When adding any new licenses to this list,
# please review the script used to generate and validate the produced text files.
# For example, it may check for any unfilled placeholders (like `<year>`) that cargo-about doesn't fail on.
#
# Unlike deny.toml's `allow`, which is a policy gate answering "may we use this
# crate", this is an ordered preference list that decides *which* license we take
# for a crate offering a choice -- and therefore which text ships in the wheels.
# Most Rust crates are "MIT OR Apache-2.0", so the first two entries decide the bulk of the bundle.
# Alphabetising this list would silently change what the published wheels contain.
#
# This must stay a superset of the root deny.toml `allow` list:
# cargo-deny decides what we may depend on.
# Note that some licenses can be allowed on a per-crate basis in deny.toml,
# whereas this list is a broader allowlist.
# deny.toml should be the source of truth for allowed licenses.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "0BSD",
  "Unlicense",
  # Category-A: https://issues.apache.org/jira/browse/LEGAL-660
  "Unicode-3.0",
  # Boost Software License Version 1.0 is allowed (Category-A):
  # https://www.apache.org/legal/resolved.html#category-a
  "BSL-1.0",
  # The MPL license is allowed (binary-only):
  # https://www.apache.org/legal/resolved.html#category-b
  "MPL-2.0",
]

# Workspace crates are ASF-owned and already covered by the wheel's LICENSE and
# NOTICE, so they are not repeated in the bundle.
[private]
ignore = true

# Clarifications

# The clarify sections update the effective license where the crate declared one is not enough.
# In some cases, the compiled artifacts include other works under different licenses which must be attributed.
# In rare cases, the license declared on the crate may simply be wrong even for source code.
# Clarify notices indicate the licenses the artifacts are offered under, while the accepted list above
# will choose which licenses to use.
# When adding new clarifications, please include ALL possible licenses that it may be licensed under and allow
# 'accepted' config to select which license is used.

[zstd-sys.clarify]
# Crate declares license only fit for Rust wrapper and generated bindings.
# However, it vendors ZStandard C sources under zstd/ which is then compiled.
license = "(MIT OR Apache-2.0) AND (GPL-2.0-only OR BSD-3-Clause)"

[[zstd-sys.clarify.files]]
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"
license = "Apache-2.0"
path = "LICENSE.Apache-2.0"

